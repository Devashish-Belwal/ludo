name: CI/CD Pipeline - Test & Deploy to AWS EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Job 1: Automated Test & Quality Gate
  test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ludo?schema=public"
      AUTH_SECRET: "ci-dummy-auth-secret-for-build-validation"
      WS_TOKEN_SECRET: "ci-dummy-ws-token-secret-for-build-validation"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_WS_URL: "ws://localhost:3001"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install Workspace Dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: packages/database
        run: bun run prisma:generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ludo?schema=public"

      - name: Build Monorepo Packages
        run: bun run build

      - name: Typecheck Monorepo
        run: bun run typecheck

      - name: Lint Codebase
        run: bun run lint

      - name: Run Game Engine Tests
        working-directory: packages/game-engine
        run: bun run test:engine

  # Job 2: Continuous Deployment to AWS EC2 (Runs on push to main)
  deploy:
    name: Deploy to AWS EC2
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          command_timeout: 30m
          timeout: 30m
          script: |
            set -e
            echo "==== Starting EC2 Deployment ===="

            # Navigate to project directory
            APP_DIR="${{ secrets.EC2_APP_DIR || '/home/ubuntu/ludo' }}"
            if [ ! -d "$APP_DIR" ]; then
              echo "Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            # Clean up old Docker build cache and dangling images to guarantee free disk space
            echo "Reclaiming disk space from previous builds..."
            sudo docker system prune -af --volumes || true
            sudo docker builder prune -af || true

            # Pull latest changes from main
            echo "Pulling latest code from main..."
            git fetch origin main
            git reset --hard origin/main

            # Ensure at least 2GB swap space exists to prevent OOM kills on small EC2 instances
            if ! swapon --show | grep -q '/swapfile'; then
              echo "Configuring 2GB swap memory on EC2..."
              sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile || true
              sudo swapon /swapfile || true
              if ! grep -q '/swapfile' /etc/fstab; then
                echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
              fi
            fi

            # Ensure Docker and Docker Compose are installed on EC2
            if ! command -v docker &> /dev/null; then
              echo "Docker not found on EC2. Installing Docker & Docker Compose..."
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io docker-compose-v2
              sudo systemctl enable --now docker
              sudo usermod -aG docker "$USER" || true
            fi

            # Ensure .env file exists on EC2 and remove any malformed comments containing equal signs
            if [ ! -f .env ]; then
              echo "Notice: .env not found. Creating from .env.production.example..."
              cp .env.production.example .env
            else
              sed -i '/^#.*=/d' .env || true
            fi

            # Rebuild and restart Docker containers sequentially to avoid CPU/RAM starvation on small instances
            echo "Rebuilding and restarting Docker containers..."
            sudo docker compose down --remove-orphans || true
            sudo docker compose build websocket
            sudo docker compose build web
            sudo docker compose up -d

            # Clean up unused dangling images to preserve disk space
            sudo docker image prune -f

            echo "==== Deployment Completed Successfully ===="
